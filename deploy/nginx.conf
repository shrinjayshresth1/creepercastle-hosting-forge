# Nginx site config for new.creepercastle.cloud
# Place at: /etc/nginx/sites-available/new.creepercastle.cloud
# Then: ln -s /etc/nginx/sites-available/new.creepercastle.cloud /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name new.creepercastle.cloud;

    # Let certbot handle ACME challenge, redirect everything else to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name new.creepercastle.cloud;

    ssl_certificate     /etc/letsencrypt/live/new.creepercastle.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.creepercastle.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Serve built React SPA
    root /var/www/creepercastle/dist;
    index index.html;

    # Proxy all /api/* requests to Express backend
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 30s;
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
}
